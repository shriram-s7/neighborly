version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neighborly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neighborly
      POSTGRES_PASSWORD: neighborly
      POSTGRES_DB: neighborly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighborly -d neighborly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
